name: Mostaql Bot

on:
  schedule:
    - cron: "0 */4 * * *"   # كل 4 ساعات (بتوقيت UTC)
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions

permissions:
  contents: write            # عشان يحفظ sent_jobs.db في الريبو

concurrency:
  group: mostaql-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -u mostqel_bot.py

      - name: Save sent_jobs.db
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent_jobs.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_jobs.db
            git commit -m "update sent jobs"
            git push
          fi
