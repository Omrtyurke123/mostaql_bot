name: Mostaql Bot - Forward

on:
  schedule:
    - cron: "*/10 * * * *"   # كل 10 دقايق (بتوقيت UTC)
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions

permissions:
  contents: write            # عشان يحفظ sent_jobs.db في الريبو

concurrency:
  group: mostaql-bot-forward
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run forwarder
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          MOSTAQL_GROUP_ID: ${{ secrets.MOSTAQL_GROUP_ID }}
          KHAMSAT_GROUP_ID: ${{ secrets.KHAMSAT_GROUP_ID }}
          NAFEZLY_GROUP_ID: ${{ secrets.NAFEZLY_GROUP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -u mostqel_bot.py forward

      - name: Save sent_jobs.db
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent_jobs.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_jobs.db
            git commit -m "update forward state"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
