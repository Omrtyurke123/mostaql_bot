# ============================================================
# نسخة بديلة: تشغيل كل ساعة، وبداخلها 4 جولات كل 15 دقيقة
# استخدمها لو تأخّرت جدولة النسخة الأساسية كثيراً.
# للتفعيل: احذف bot.yml أو عطّل جدولته، ثم فعّل هذا الملف.
# ============================================================

name: Mostaql Bot (Hourly x4)

on:
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mostaql-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          PAGES: "1"
          MAX_OFFERS: "10"
          TOP_N: "10"
          ROUNDS: "4"
          ROUND_GAP_MIN: "15"
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          if git diff --staged --quiet; then
            echo "لا يوجد تغيير في الحالة"
          else
            git commit -m "chore: update sent.json [skip ci]"
            git pull --rebase --autostash
            git push
          fi
